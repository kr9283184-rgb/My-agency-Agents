name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s CHANGELOG.md
      - name: Validate README links syntax
        run: python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text(encoding='utf-8')
          assert text.count('```') % 2 == 0, 'Unbalanced fenced code blocks in README.md'
          assert len(text.strip()) > 500, 'README.md is unexpectedly short'
          print('Repository documentation checks passed')
          PY
