[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-team"
version = "0.2.0"
description = "Runnable multi-department AI agent orchestration foundation"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
